<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رادار صفقات العقارات</title>
<meta name="theme-color" content="#14213d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="رادار العقارات">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef0f4;--surface:#fff;--field:#fff;--ink:#14213d;--muted:#586278;--line:#d5d9e3;--gold:#c9a24b;--navy:#14213d;--on-gold:#14213d;--focus:#1c4fd8;--link:#1b4bc4;--good:#12764a;--bar:#3b5bb5;--font:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0b1020;--surface:#151d33;--field:#0e1528;--ink:#eef1f8;--muted:#9aa5bd;--line:#2a3550;--gold:#d8b45e;--navy:#0a0f1f;--focus:#7aa2ff;--link:#8fb0ff;--good:#5fd39a;--bar:#7aa2ff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1020;--surface:#151d33;--field:#0e1528;--ink:#eef1f8;--muted:#9aa5bd;--line:#2a3550;--gold:#d8b45e;--navy:#0a0f1f;--focus:#7aa2ff;--link:#8fb0ff;--good:#5fd39a;--bar:#7aa2ff;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55;padding-bottom:calc(32px + env(safe-area-inset-bottom))}
header{background:var(--navy);color:#fff;padding:calc(16px + env(safe-area-inset-top)) 16px 18px;border-bottom:3px solid var(--gold)}
header .wrap{position:relative;min-height:98px}
.logo{position:absolute;left:0;top:0;width:52px;height:52px;border-radius:13px;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.lang{position:absolute;left:0;top:62px;height:34px;min-width:52px;border-radius:99px;border:2px solid var(--gold);background:transparent;color:#fff;font:inherit;font-weight:700;cursor:pointer}
header h1{margin:0;font-size:22px;font-weight:700;padding-inline-end:0;padding-left:64px}
header p{margin:4px 0 0;color:#c9d1e6;font-size:14px;padding-left:64px}
.wrap{max-width:1040px;margin:0 auto}
main{padding:16px;display:flex;flex-direction:column;gap:22px}
h2{margin:0 0 10px;font-size:18px;font-weight:700;border-inline-start:4px solid var(--gold);padding-inline-start:10px}
.sub{margin:-4px 0 12px;color:var(--muted);font-size:14px}
.filters{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.filters .full{grid-column:1/-1}
label,.lbl{display:block;font-size:14px;color:var(--muted);margin-bottom:4px}
select,input,textarea{width:100%;min-height:48px;border:1px solid var(--line);border-radius:12px;background:var(--field);color:var(--ink);font:inherit;font-size:16px;padding:0 12px;font-variant-numeric:tabular-nums}
textarea{padding:10px 12px;min-height:84px}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.8}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.range{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:grid;grid-template-columns:repeat(2,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg.t3{grid-template-columns:repeat(3,1fr)}
.seg button{min-height:46px;border:0;border-bottom:1px solid var(--line);background:var(--field);color:var(--ink);font:inherit;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.seg button:not(:nth-child(2n)){border-inline-start:0}
.seg.t3 button{border-inline-end:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff;font-weight:700;box-shadow:inset 0 -3px 0 var(--gold)}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{background:var(--gold);color:var(--on-gold)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{background:var(--gold);color:var(--on-gold)}}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chips button{min-height:38px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:var(--field);color:var(--ink);font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
.chips button[aria-pressed="true"]{background:var(--gold);color:var(--on-gold);border-color:var(--gold);font-weight:700}
.chips.em{margin-top:0}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0}
.search{width:100%;min-height:52px;border:0;border-radius:14px;background:var(--gold);color:var(--on-gold);font:inherit;font-size:18px;font-weight:700;cursor:pointer}
.summary{margin-top:10px;padding:10px 14px;border-radius:12px;background:var(--surface);border:1px dashed var(--gold);font-size:14px}
.grid{display:grid;gap:12px;grid-template-columns:1fr}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card h3{margin:0;font-size:17px;font-weight:700}
.card p{margin:0;color:var(--muted);font-size:14px}
.card.brand{border-color:var(--gold);background:linear-gradient(160deg,var(--surface),color-mix(in srgb,var(--gold) 14%,var(--surface)))}
.tag{align-self:flex-start;font-size:12px;font-weight:500;padding:2px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.tag.ok{color:var(--good);border-color:var(--good)}.tag.ad{color:var(--gold);border-color:var(--gold)}
.go{margin-top:auto;display:flex;align-items:center;justify-content:center;min-height:44px;border-radius:12px;background:var(--gold);color:var(--on-gold);font-weight:700;text-decoration:none;border:0;font:inherit;font-weight:700;cursor:pointer;padding:0 12px}
.go.alt{background:transparent;color:var(--link);border:1px solid var(--line)}
.go.sm{min-height:34px;font-size:13px}
.tools{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.tools button{min-height:40px;padding:0 14px;border-radius:99px;border:1px dashed var(--gold);background:transparent;color:var(--ink);font:inherit;cursor:pointer}
.addbox{margin-top:10px;display:grid;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat .n{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}.stat .l{font-size:14px;color:var(--muted)}.stat a{font-size:13px;color:var(--link);margin-top:6px}
.price{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}.meta{font-size:14px;color:var(--muted)}
.empty{grid-column:1/-1;color:var(--muted);font-size:14px;margin:0}
.note{background:var(--surface);border:1px solid var(--line);border-inline-start:4px solid var(--gold);border-radius:12px;padding:12px 14px;font-size:14px;color:var(--muted)}
.note b{color:var(--ink)}
.pk{text-align:center;gap:4px}.pk .e{font-size:28px}.pk .pr{font-size:24px;font-weight:700}
.form{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .full{grid-column:1/-1}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.chart h3{margin:0 0 8px;font-size:16px}
.bars{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;align-items:end;height:150px;border-bottom:1px solid var(--line)}
.bar{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:11px;color:var(--muted)}
.bar i{display:block;width:100%;background:var(--bar);border-radius:5px 5px 0 0;min-height:2px}
.bar span{font-variant-numeric:tabular-nums;margin-bottom:2px;direction:ltr}
.mons{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;font-size:12px;color:var(--muted);text-align:center;margin-top:4px}
.install{display:none;background:var(--surface);border:1px solid var(--gold);border-radius:14px;padding:12px 14px;font-size:14px;gap:10px;align-items:center;justify-content:space-between}
.install.show{display:flex}
.install button{min-height:40px;padding:0 16px;border-radius:10px;border:0;background:var(--gold);color:var(--on-gold);font:inherit;font-weight:700;cursor:pointer}
html[dir=ltr] header h1,html[dir=ltr] header p{padding-left:0;padding-right:64px}
html[dir=ltr] .logo,html[dir=ltr] .lang{left:auto;right:0}
@media (min-width:700px){.grid{grid-template-columns:repeat(2,1fr)}}
@media (min-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}main{padding:24px 16px}}
.enb{font-weight:800;letter-spacing:.16em;font-size:12px;color:var(--gold);margin:0 0 4px;padding-left:64px;direction:ltr;text-align:right}
html[dir=ltr] .enb{display:none}
.dl{margin-top:10px;background:var(--gold);color:var(--navy);border:0;border-radius:99px;padding:9px 18px;font:inherit;font-weight:700;cursor:pointer}
.dlp{margin-top:10px;background:rgba(255,255,255,.1);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.8}
.dlp a{color:var(--gold);font-weight:700}
</style>
</head>
