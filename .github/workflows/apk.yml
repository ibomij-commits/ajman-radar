name: Build APK
on:
  push:
    paths: ['android/**', '.github/workflows/apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build
        working-directory: android
        run: gradle --no-daemon assembleRelease
      - name: Publish release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          cp android/app/build/outputs/apk/public/release/app-public-release.apk radar.apk
          cp android/app/build/outputs/apk/control/release/app-control-release.apk radar-control.apk
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest radar.apk radar-control.apk --title "رادار العقارات APK" --notes "radar.apk للجمهور، radar-control.apk لك للتحكم"
